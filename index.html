<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Flow | Pomodoro Mixer</title>
    <link rel="stylesheet" href="./CSS/style.css" />
  </head>
  <body>
    <main class="app-container">
      <!-- Header -->
      <header class="header">
        <h1>KodoFocus</h1>
        <h2>Timer and live-sound</h2>
      </header>

      <!-- Main section-->
      <section class="main-section">
        <!-- Timer section-->
        <div class="timer-section">
          <!-- Timer section buttons-->

          <div class="btn-timer-mode">
            <button class="btn-timer active">Focus</button>
            <button class="btn-timer">Short break</button>
            <button class="btn-timer">Long break</button>
          </div>

          <!-- Timer -->
          <div class="timer">
            <!-- Progress Bar-->

            <div
              class="progress-bar"
              role="progressbar"
              aria-valuenow="0"
              aria-valumax="100"
              style="--p: 0"
            >
              <!-- Progress Value-->
              <div class="progress-value">
                <h3 class="mode">FOCUS</h3>
                <span class="time">25:00</span>

                <!-- Progress Bar btns-->
                <div class="progress-bar-btns">
                  <button class="btn-start">
                    <span class="btn-start-content">Start</span>
                  </button>
                  <button class="btn-restart"></button>
                </div>
              </div>
            </div>
          </div>
          <!--Time variants btn-->
          <div class="variant-btn-container">
            <button class="variant-btn">15 min</button>
            <button class="variant-btn">25 min</button>
            <button class="variant-btn">45 min</button>
            <button class="variant-btn">Own time</button>
          </div>
        </div>

        <!-- Sound section -->
        <div class="sound-section">
          <!-- Sound variants-->
          <div class="variant-btn-container sound-variants">
            <button class="variant-btn">Sunny Grove</button>
            <button class="variant-btn">Rainy Study</button>
            <button class="variant-btn">Thunderstorm and Fireplace</button>
            <button class="variant-btn-reset">Reset</button>
          </div>

          <div class="sounds-grid" id="sounds-grid"></div>
        </div>
      </section>

      <div id="modal" class="modal">
        <div class="modal-content">
          <div class="modal-header">
            <div class="header-icon">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="12" cy="12" r="9" />
                <polyline points="12 7 12 12 15 14" />
              </svg>
            </div>

            <h2 class="modal-title">Own time</h2>
            <p class="modal-subtitle">
              Specify the duration of the focus session in minutes
            </p>

            <button id="closeModal" class="modal-close">&times;</button>
          </div>
          <div class="input-container">
            <button type="button" class="input-btn decrease">-5</button>

            <div class="input-value-wrapper">
              <input
                id="modal-input"
                class="modal-input"
                type="number"
                value="25"
                min="5"
                step="5"
              />
              <label for="modal-input" class="input-unit">min</label>
            </div>

            <button type="button" class="input-btn increase">+5</button>
          </div>
          <div class="modal-btns">
            <button class="modal-btn cancel-btn">Cancel</button>
            <button class="modal-btn accept-btn">Accept</button>
          </div>
        </div>
      </div>
    </main>

    <script src="./JS/script.js" defer type="module"></script>
  </body>
</html>
