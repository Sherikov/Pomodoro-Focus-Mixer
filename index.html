<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Flow | Pomodoro Mixer</title>
    <link rel="stylesheet" href="./CSS/style.css" />
  </head>
  <body>
    <main class="app-container">
      <!-- Header -->
      <header class="header">
        <h1>KodoFocus</h1>
        <h2>Timer and live-sound</h2>
      </header>

      <!-- Main section-->
      <section class="main-section">
        <!-- Timer section-->
        <div class="timer-section">
          <!-- Timer section buttons-->
          <div class="btn-timer-mode">
            <button class="btn-timer">Focus</button>
            <button class="btn-timer">Short</button>
            <button class="btn-timer">Long</button>
          </div>
        </div>

        <!-- Sound section -->
        <div class="sound-section"></div>
      </section>
    </main>

    <script src="./JS/script.js"></script>
  </body>
</html>
